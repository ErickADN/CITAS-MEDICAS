<a   [routerLink]="route" class="text-decoration-none">
  <div  class="card action-card text-center border-0 shadow-sm h-100">
    <div class="card-body">
      <div class="icon mb-3 text-{{ color }}">
        <i [class]="icon"></i>
      </div>

      <h5  class="fw-bold">{{ title }}</h5>
      <p class="text-muted small">{{ description }}</p>
    </div>
  </div>
</a>
